# Pinned so the workspace, CI, and the Docker build all agree; bump
# deliberately.
#
# The floor is not edition 2024 (1.85) — it is the dependency graph:
#   vergen 10   -> 1.96   (highest)
#   wasmtime 48 -> 1.95
#   sqlx 0.9    -> 1.94   (via sea-orm 2.0)
[toolchain]
# The patch version, not the `1.98` channel.
#
# `rust:1.98-slim` ships toolchain `1.98.1`. rustup matches by name, so the
# channel `1.98` is a *different* toolchain to it and gets downloaded and
# installed on every Docker build — several hundred megabytes committed into a
# builder layer that is then thrown away. Naming the version the base image
# already has makes rustup find it and do nothing.
#
# This couples the pin to the `FROM rust:…` line in the Dockerfile. They are
# meant to agree, which is what this file is for; bump them together.
channel = "1.98.1"
components = ["rustfmt", "clippy"]

# `minimal` plus the two components above, not `default`.
#
# `default` adds `rust-docs`: around half a gigabyte of generated HTML for the
# standard library. In the Docker build that is not merely downloaded, it is
# committed into a builder layer — the base image ships toolchain `1.98.1`
# while this file names the channel `1.98`, which rustup treats as a different
# toolchain and installs in full. A build here failed writing that layer with
# `no space left on device`, on a file under `share/doc/rust/html`.
#
# What is lost is offline `cargo doc --open` for `std`. Add it back per machine
# with `rustup component add rust-docs`; nothing in this repository needs it.
profile = "minimal"
