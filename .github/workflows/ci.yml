name: CI

on:
  push: { branches: [master] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Enforces the hexagonal dependency rule (ADR-0001/0002): `domain` performs
  # no I/O. Cheap, fast, and catches the violation that quietly erodes the
  # whole structure.
  # ---------------------------------------------------------------------------
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: domain has no I/O dependencies
        run: |
          set -euo pipefail
          forbidden='axum|sea-orm|sqlx|reqwest|wasmtime|tower|openidconnect|zip'
          if grep -nE "^($forbidden)" crates/domain/Cargo.toml; then
            echo "::error file=crates/domain/Cargo.toml::domain must not depend on I/O crates (ADR-0001)"
            exit 1
          fi
          echo "ok: domain dependency rule holds"

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nyuka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nyuka_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings

      # The conformance fixture is a wasm guest that asserts what the host
      # returns. Its .aix is a build artifact, and the integration test SKIPS
      # when it is absent — so CI builds it and then asserts it exists, or a
      # regression could hide behind a silent skip.
      - name: Build the conformance fixture
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          crates/aidoku-runtime/conformance/package.sh
          test -f crates/aidoku-runtime/conformance/nyuka-conformance.aix

      - name: Test
        # DATABASE_URL is set for the whole job, so the migration and claim
        # tests run rather than skipping. A skipped concurrency test looks
        # exactly like a passing one.
        run: cargo test --workspace --all-features

      # ADR-0002: SeaORM type-checks against ENTITY definitions, not the live
      # schema, so a migration that outpaces its entity compiles and fails at
      # runtime. This converts that class of bug into a build failure and is
      # the control that makes ADR-0002 safe rather than merely convenient.
      # ADR-0002: SeaORM type-checks against ENTITY definitions, not the live
      # schema, so a migration that outpaces its entity compiles and fails at
      # runtime. Regenerating and diffing turns that into a build failure, and
      # is the control that makes ADR-0002 safe rather than merely convenient.
      - name: Schema drift check
        run: |
          set -euo pipefail
          # rustls, not native-tls: the default features pull openssl-sys,
          # which needs system OpenSSL headers the runner does not have.
          cargo install sea-orm-cli --locked --version '^2' \
            --no-default-features \
            --features codegen,sqlx-postgres,runtime-tokio-rustls
          cargo run -q -p nyuka-persistence --bin migrate -- fresh
          # These flags must match the ones the committed entities were
          # generated with, or the diff fails on formatting rather than drift.
          sea-orm-cli generate entity \
            --database-url "$DATABASE_URL" \
            --output-dir /tmp/entity \
            --with-serde both \
            --ignore-tables seaql_migrations
          diff -ru crates/persistence/src/entity /tmp/entity

      # ADR-0008/0009: openapi.json is the frontend contract. Stale means the
      # generated TypeScript client no longer matches the server.
      - name: OpenAPI freshness
        run: |
          set -euo pipefail
          echo "TODO(scaffold): cargo xtask openapi && git diff --exit-code web/openapi.json"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # deny.toml carries one documented advisory exception: RUSTSEC-2023-0071
      # (rsa Marvin attack), reached via openidconnect. The reasoning, owner,
      # and review date are recorded there per ADR-0005.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check advisories bans licenses sources }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci

      - name: Biome
        run: npx biome ci .

      - name: Typecheck
        run: npx tsc --noEmit

      # ADR-0011: an untranslated string should be a build failure, not a
      # runtime fallback. This is the whole point of compile-time extraction.
      - name: Lingui catalogs current
        run: npm run i18n:check

      # ADR-0008: routeTree.gen.ts is generated and committed.
      - name: Route tree current
        run: |
          set -euo pipefail
          echo "TODO(scaffold): npx tsr generate && git diff --exit-code src/routeTree.gen.ts"

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npx size-limit

      - name: Dead exports
        run: npx knip
